<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>Misión Cóndor</title>
  <meta name="description" content="Misión Cóndor · ARQUISOFT · NASA Space Apps Challenge 2026">
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none; }
    /* Phaser centra el lienzo y su capa DOM con márgenes: aquí NO se usa flex (centraría dos veces y descuadra todo) */
    #juego { position: fixed; inset: 0; background: #000; }
    #juego canvas { display: block; }
    #girar { display: none; position: fixed; inset: 0; z-index: 9; background: #000; color: #ffe14d;
      font: 700 18px/1.5 'Open Sans', system-ui, sans-serif; align-items: center; justify-content: center; text-align: center; padding: 24px; }
    @media (orientation: portrait) and (max-width: 820px) { #girar { display: flex; } }
  </style>
</head>
<body>
  <div id="juego"></div>
  <div id="girar"><span data-es="Gira el teléfono en horizontal" data-en="Turn your phone sideways">Gira el teléfono en horizontal</span><br><span data-es="para jugar Misión Cóndor ↻" data-en="to play Misión Cóndor ↻">para jugar Misión Cóndor ↻</span></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
