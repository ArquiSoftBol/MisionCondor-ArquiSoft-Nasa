<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>Misión Cóndor</title>
  <meta name="description" content="Misión Cóndor · ARQUISOFT · NASA Space Apps Challenge 2026">
  <!-- instalable como app (Android, iOS, Windows, Mac, Linux): «Agregar a pantalla de inicio» / «Instalar» -->
  <link rel="manifest" href="./app/manifest.webmanifest">
  <link rel="icon" type="image/png" href="./app/favicon.png">
  <link rel="apple-touch-icon" href="./app/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Misión Cóndor">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none; overscroll-behavior: none;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; }
    input { -webkit-user-select: text; user-select: text; }
    /* Phaser centra el lienzo y su capa DOM con márgenes: aquí NO se usa flex (centraría dos veces y descuadra todo) */
    /* respeta el notch y la barra de gestos de los celulares (viewport-fit=cover) */
    #juego { position: fixed; background: #000;
      top: env(safe-area-inset-top, 0px); right: env(safe-area-inset-right, 0px); bottom: env(safe-area-inset-bottom, 0px); left: env(safe-area-inset-left, 0px); }
    #juego canvas { display: block; }
    #girar { display: none; position: fixed; inset: 0; z-index: 9; background: radial-gradient(circle at 50% 40%, #0b2236, #000 70%); color: #ffe14d;
      font: 700 18px/1.5 'Open Sans', system-ui, sans-serif; flex-direction: column; gap: 22px; align-items: center; justify-content: center; text-align: center; padding: 24px; }
    #girar .tel { width: 46px; height: 80px; border: 4px solid #3ff3ff; border-radius: 10px; box-shadow: 0 0 18px #3ff3ff66; animation: girar 2.2s ease-in-out infinite; }
    #girar small { color: #9fb3d1; font-size: 13px; font-weight: 600; }
    @keyframes girar { 0%, 25% { transform: rotate(0deg); } 55%, 100% { transform: rotate(-90deg); } }
    @media (orientation: portrait) and (max-width: 820px) { #girar { display: flex; } }
  </style>
</head>
<body>
  <div id="juego"></div>
  <div id="girar">
    <div class="tel"></div>
    <div><span data-es="Gira el teléfono en horizontal" data-en="Turn your phone sideways">Gira el teléfono en horizontal</span><br>
      <small data-es="Misión Cóndor se juega con la pantalla acostada" data-en="Misión Cóndor is played in landscape">Misión Cóndor se juega con la pantalla acostada</small></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
