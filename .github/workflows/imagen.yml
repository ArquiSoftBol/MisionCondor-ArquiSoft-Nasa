# Cada push a main: compila, prueba que el servidor arranca y publica la imagen Docker en
# GitHub Container Registry → ghcr.io/<usuario>/<repo>:latest  (sirve para cualquier VPS o Fly/Render)
name: Imagen Docker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  imagen:
    runs-on: ubuntu-latest
    env:
      RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Compilar
        run: npm ci && npm run build:servidor

      - name: Prueba de humo (el servidor arranca y responde)
        run: |
          CONDOR_DATOS=$RUNNER_TEMP/datos PORT=8090 node dist/servir.mjs &
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8090/api/salud && exit 0; sleep 0.5; done
          exit 1

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Nombre de la imagen en minúsculas
        run: echo "IMAGEN=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGEN }}:latest,${{ env.IMAGEN }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Opcional: si usas Render, crea el secreto RENDER_DEPLOY_HOOK (Settings → Deploy Hook en Render)
      - name: Avisar a Render
        if: ${{ env.RENDER_HOOK != '' }}
        run: curl -fsS -X POST "$RENDER_HOOK"
