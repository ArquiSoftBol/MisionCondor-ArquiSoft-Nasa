# Opción «juego en GitHub Pages + servidor multijugador aparte».
# GitHub Pages solo sirve archivos: NO puede correr el WebSocket ni la base de datos.
# Antes de activarlo crea la variable del repo  VITE_SERVIDOR_MP = wss://TU-SERVIDOR/ws
# (Settings → Secrets and variables → Actions → Variables). Sin ella, el modo historia funciona
# pero el multijugador no encontrará servidor.
name: GitHub Pages

on:
  workflow_dispatch:      # manual; cambia a «push: branches: [main]» si lo quieres automático

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Compilar
        env:
          VITE_SERVIDOR_MP: ${{ vars.VITE_SERVIDOR_MP }}
        run: npm ci && node herramientas/atlas.mjs && npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
